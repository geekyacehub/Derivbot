# Render Blueprint — DerivBot Pro X (100% Free, Static Site)
# Deploy: Render Dashboard → New → Blueprint → connect this repo
# Or manually: New → Static Site → Repo: geekyacehub/Derivbot, Branch: arena/55f7f22f-derivbot
services:
  - type: web
    name: derivbot-pro-x
    env: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
